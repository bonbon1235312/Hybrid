services:
  mysql:
    image: mysql:8.0.46
    command: --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: hybrid
      MYSQL_USER: hybrid
      MYSQL_PASSWORD: hybrid
      MYSQL_ROOT_PASSWORD: hybrid-root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u hybrid -phybrid --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hybrid-mysql:/var/lib/mysql

volumes:
  hybrid-mysql:
