services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hybrid
      POSTGRES_PASSWORD: hybrid
      POSTGRES_USER: hybrid
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hybrid -d hybrid"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hybrid-postgres:/var/lib/postgresql/data

volumes:
  hybrid-postgres:
